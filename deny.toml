[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# spin 0.9.8 is yanked but only reachable transitively through rsa; keep
# yanks as a warning, not a hard failure, until rsa 0.10 stabilizes.
yanked = "warn"
# Deferred dependency migrations. Each entry MUST cite the migration
# path in docs/DEPENDENCY-DEBT.md. Removing the debt is the exit
# criterion — not silencing the check.
ignore = [
    # rsa 0.9 Marvin timing sidechannel. cat-token uses rsa only for
    # PS256 signature *verification*; the Marvin attack targets private
    # key operations, so this crate as a recipient is not on the attack
    # surface. Issuers using this crate to sign PS256 tokens ARE
    # exposed. Awaiting rsa 0.10 stable; see docs/DEPENDENCY-DEBT.md.
    { id = "RUSTSEC-2023-0071", reason = "verifier-side only; awaiting rsa 0.10 stable — see docs/DEPENDENCY-DEBT.md" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
