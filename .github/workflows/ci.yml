name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --locked --verbose

    - name: Run tests
      run: cargo test --locked --verbose

    - name: Run integration tests
      run: cargo test --locked --test integration_tests --verbose

    - name: Build CLI binary
      run: cargo build --locked --bin cat-cli --verbose

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "builtin-trie"
          - "moqt"
          - "builtin-trie,moqt"
          - "qp-trie"
          - "qp-trie,moqt"
          # `async` implies `moqt` (see Cargo.toml); listed explicitly
          # so the async trait surface is gated on the same clippy/test
          # bar as the sync surface. Adding either combination is what
          # keeps AsyncMoqtValidator / AsyncJtiStore / AsyncReplayGuard
          # from silently regressing when the sync side is refactored.
          - "moqt,async"
          - "builtin-trie,moqt,async"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Build with features '${{ matrix.features }}'
      run: cargo build --locked --no-default-features --features "${{ matrix.features }}"

    - name: Test with features '${{ matrix.features }}'
      run: cargo test --locked --no-default-features --features "${{ matrix.features }}"

    - name: Clippy with features '${{ matrix.features }}'
      run: cargo clippy --locked --no-default-features --features "${{ matrix.features }}" -- -D warnings

  clippy-no-features:
    name: Clippy (no default features)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Clippy --lib --no-default-features
      run: cargo clippy --locked --lib --no-default-features -- -D warnings

  cargo-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Install cargo-audit
      run: cargo install --locked cargo-audit@0.22.2

    - name: Run cargo audit
      run: cargo audit

  cargo-deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install cargo-deny
      uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2

  miri:
    name: Miri (undefined behavior check)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust nightly with Miri
      uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      with:
        components: miri

    - name: Run Miri on unit tests
      # `-Zmiri-disable-isolation` lets the test suite call SystemTime::now()
      # (DpopPayload::new derives iat from wall-clock time). Miri's default
      # isolation blocks all syscalls, which is the wrong bar for a
      # provenance / UB check — we only want the Stacked Borrows / Tree
      # Borrows model here.
      run: cargo +nightly miri test --lib --all-features
      env:
        MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation

  doc-test:
    name: Documentation Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Run doc tests
      run: cargo test --locked --doc --all-features

  draft-vectors:
    name: Draft Vector Emission
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    # Strict gate: cat.rs must produce a draft-md block that its own verify
    # command can round-trip. This catches emitter regressions (wrapping,
    # hex truncation, missing fields) before they reach the draft repo.
    - name: Emit Appendix A and self-verify
      run: |
        cargo run --locked --bin generate-test-vectors --features moqt -- --emit draft-md --out /tmp/draft_appendix_a.md
        cargo run --locked --bin generate-test-vectors --features moqt -- --verify --from-file /tmp/draft_appendix_a.md

    # Advisory gate: report drift against the current CAT-4-MOQT main
    # branch. Cannot be strict — cat.rs is the source of truth, so any
    # cat.rs bump that changes a vector will drift main until the draft
    # is updated. The report is what tells us the draft needs a refresh.
    - name: Compare against draft-ietf-moq-c4m main (advisory)
      continue-on-error: true
      run: |
        cargo run --locked --bin generate-test-vectors --features moqt -- \
          --verify --from https://raw.githubusercontent.com/moq-wg/CAT-4-MOQT/main/draft-ietf-moq-c4m.md

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Install cargo-tarpaulin
      run: cargo install --locked cargo-tarpaulin@0.31.5

    - name: Generate code coverage
      run: cargo tarpaulin --locked --verbose --all-features --workspace --timeout 120 --out xml

    - name: Upload to codecov.io
      uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
      with:
        fail_ci_if_error: false
