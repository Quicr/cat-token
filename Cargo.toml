[package]
name = "cat-token"
version = "0.5.1"
edition = "2024"
authors = ["Suhas Nandakumar"]
description = "Strict fail-closed profile of CTA-5007-B CAT and CAT-4-MOQT (see docs/PROFILE.md for supported claim forms and rejections)"
license = "BSD-2-Clause"
repository = "https://github.com/Quicr/cat-token"
keywords = ["cat", "cwt", "cbor", "token", "authentication"]
categories = ["authentication", "cryptography"]

[dependencies]
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
base64 = "0.22"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
lru = "0.18"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
geohash = "0.13"
aes-gcm = "0.10"
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
sfv = "0.9"

# Optional qp-trie dependency
qp-trie = { version = "0.8", optional = true }

# Optional async trait support for AsyncJtiStore / AsyncReplayGuard.
async-trait = { version = "0.1", optional = true }

# `futures::future::join_all` used by `jti_contract::asynchronous` to
# drive concurrent inserts without picking a runtime for the caller.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }

[dependencies.regex]
version = "1.10"

[dependencies.hex]
version = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
criterion = { version = "0.5", features = ["html_reports"] }
x509-cert = { version = "0.2", features = ["std", "builder"] }


[lib]
name = "cat_token"
path = "src/lib.rs"

[[bin]]
name = "cat-cli"
path = "src/bin/main.rs"
required-features = ["moqt"]

[[bin]]
name = "generate-test-vectors"
path = "src/bin/generate_test_vectors.rs"
required-features = ["moqt"]

[[bench]]
name = "token_bench"
harness = false
required-features = ["moqt"]

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "cbor_bench"
harness = false

[[bench]]
name = "trie_bench"
harness = false
required-features = ["builtin-trie"]

[[bench]]
name = "async_scale_bench"
harness = false
required-features = ["async"]

[[example]]
name = "quickstart"
required-features = ["moqt"]

[[example]]
name = "relay_validator"
required-features = ["moqt"]

[[example]]
name = "server_token_issuer"
required-features = ["moqt"]

[[example]]
name = "generic_cat"

[[example]]
name = "async_relay_validator"
required-features = ["async"]

[features]
# The default profile is CAT-4-MOQT: a strict fail-closed MoQT relay
# validator with an in-process prefix/suffix trie for catnip/catu match
# rules. Turn `default-features = false` off for a generic CWT / CTA-
# 5007-B CAT library — you get the CBOR + COSE + signature/mac + claim-
# evaluation core but no MoQT-scope matching (`MoqtValidator`, MOQT
# claim helpers, DPoP validator entry points), no URI trie, and no
# async surface. Use this profile when integrating cat-token into a
# non-MoQT authorization system.
default = ["builtin-trie", "moqt"]
# Built-in prefix/suffix trie for catnip/catu URI matching. Zero extra
# dependencies. Sufficient for most deployments.
builtin-trie = []
# Alternative trie backend using the `qp-trie` crate. Faster lookup at
# the cost of a dependency; takes precedence if both `builtin-trie` and
# `qp-trie` are enabled.
qp-trie = ["dep:qp-trie"]
# CAT-4-MOQT scope matching and the MoqtValidator authorize pipeline.
# Off = generic CWT library only.
moqt = []
# Adds AsyncJtiStore / AsyncReplayGuard / AsyncMoqtValidator::authorize so
# relays can integrate cat-token into an async event loop without wrapping
# every call in spawn_blocking. Requires moqt.
async = ["moqt", "dep:async-trait", "dep:futures"]
