[package]
name = "cat-token"
version = "0.3.0"
edition = "2024"
authors = ["Suhas Nandakumar"]
description = "Strict fail-closed profile of CTA-5007-B CAT and CAT-4-MOQT (see docs/PROFILE.md for supported claim forms and rejections)"
license = "BSD-2-Clause"
repository = "https://github.com/Quicr/cat-token"
keywords = ["cat", "cwt", "cbor", "token", "authentication"]
categories = ["authentication", "cryptography"]

[dependencies]
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
base64 = "0.22"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
lru = "0.16"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
geohash = "0.13"
aes-gcm = "0.10"
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
sfv = "0.9"

# Optional qp-trie dependency
qp-trie = { version = "0.8", optional = true }

[dependencies.regex]
version = "1.10"

[dependencies.hex]
version = "0.4"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
x509-cert = { version = "0.2", features = ["std", "builder"] }


[lib]
name = "cat_token"
path = "src/lib.rs"

[[bin]]
name = "cat-cli"
path = "src/bin/main.rs"
required-features = ["moqt"]

[[bin]]
name = "generate-test-vectors"
path = "src/bin/generate_test_vectors.rs"
required-features = ["moqt"]

[[bench]]
name = "token_bench"
harness = false
required-features = ["moqt"]

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "cbor_bench"
harness = false

[[bench]]
name = "trie_bench"
harness = false
required-features = ["builtin-trie"]

[[example]]
name = "quickstart"
required-features = ["moqt"]

[[example]]
name = "relay_validator"
required-features = ["moqt"]

[[example]]
name = "server_token_issuer"
required-features = ["moqt"]

[[example]]
name = "generic_cat"

[features]
default = ["builtin-trie", "moqt"]
builtin-trie = []
qp-trie = ["dep:qp-trie"]
moqt = []
